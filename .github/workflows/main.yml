name: Salah Archive Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run isolated SQLite smoke test
        run: python smoke_test_sqlite_isolated.py

      - name: Build integrity-compatible portable folder
        shell: cmd
        run: |
          py -3.11 -m PyInstaller --noconfirm --clean --onedir --windowed --name SalahArchive --add-data "brand_logo.png;." --hidden-import fitz --hidden-import PIL --hidden-import pytesseract --hidden-import pdfplumber --hidden-import openpyxl --hidden-import docx --hidden-import mysql.connector main.py
          if errorlevel 1 exit /b 1
          py -3.11 -c "import json,shutil,pathlib,sys; base=pathlib.Path('.'); out=pathlib.Path('dist/SalahArchive'); m=json.loads((base/'integrity_manifest.json').read_text(encoding='utf-8')); missing=[k for k in m.get('files',{}) if not (base/k).is_file()]; print('Missing manifest files:', missing); [ (out.joinpath(k).parent.mkdir(parents=True,exist_ok=True),shutil.copy2(base/k,out/k)) for k in m.get('files',{}) if (base/k).is_file() ]; shutil.copy2(base/'integrity_manifest.json',out/'integrity_manifest.json'); shutil.copy2(base/'integrity_manifest.sig',out/'integrity_manifest.sig'); sys.exit(2 if missing else 0)"
          if errorlevel 1 exit /b 1
          if not exist "dist\SalahArchive\SalahArchive.exe" exit /b 1

      - name: Verify signed package integrity
        run: python .github/scripts/verify_package_integrity.py dist/SalahArchive

      - name: Package portable folder
        shell: pwsh
        run: Compress-Archive -Path "dist/SalahArchive/*" -DestinationPath "dist/SalahArchive-Windows-Test.zip" -Force

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: SalahArchive-Windows-Test
          path: dist/SalahArchive-Windows-Test.zip
          if-no-files-found: error
          retention-days: 7
